<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/navigation-shell.js?v=2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL, JUI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='32' y='46' font-family='Inter,Arial,sans-serif' font-size='42' font-weight='900' fill='%23FFFFFF' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/styles.css?v=unbounded-2">
    <style>
        body{margin:0;background:#000;overflow:hidden}
        .visual-hero{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
        .visual-bg{position:absolute;inset:0}
        .visual-bg img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.7) contrast(1.06) brightness(0.88)}
        .visual-overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.12) 45%, transparent 72%)}
        .visual-content{position:absolute;left:6%;top:70%;transform:translateY(-50%);max-width:40rem;z-index:2;pointer-events:none}
        .visual-title{font-family:var(--font-display);font-size:clamp(2.3rem,4.5vw,3.7rem);font-weight:800;letter-spacing:-0.03em;color:#FFFFFF;margin:0 0 1.3rem;line-height:1.05;text-shadow:0 2px 18px rgba(0,0,0,0.45)}
        .visual-desc{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:1.22rem;line-height:1.9;color:#FFFFFF;margin:0;max-width:38rem}
        .visual-actions{display:flex;align-items:center;gap:2rem;margin-top:2rem;font-family:var(--font-mono);pointer-events:auto}
        .visual-actions a,.visual-actions button{position:relative;padding:.25rem 0;border:0;background:none;color:#D3D2CA;font:600 .72rem/1 var(--font-mono);letter-spacing:.18em;text-decoration:none;cursor:pointer;text-shadow:0 2px 12px #000;text-transform:uppercase}
        .visual-actions a::after,.visual-actions button::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:1px;background:#D3D2CA;transform:scaleX(.25);transform-origin:left;opacity:.5;transition:transform .25s ease,opacity .25s ease}
        .visual-actions a:hover::after,.visual-actions button:hover::after,.visual-actions a:focus-visible::after,.visual-actions button:focus-visible::after{transform:scaleX(1);opacity:1}
        .visual-actions a:focus-visible,.visual-actions button:focus-visible{outline:1px solid #AAA99F;outline-offset:8px}

        /* Top bar, minimal, two links only */
        .visual-topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:1.6rem;padding:1.5rem 2rem;pointer-events:none}
        .visual-topbar a{pointer-events:auto;font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;text-decoration:none;color:rgba(255,255,255,0.7);transition:color 200ms ease;position:relative}
        .visual-topbar a::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:#fff;transform:scaleX(0);transform-origin:right;transition:transform 300ms cubic-bezier(0.16,1,0.3,1)}
        .visual-topbar a:hover{color:#fff}
        .visual-topbar a:hover::after{transform:scaleX(1);transform-origin:left}

        @media(max-width:640px){
            .visual-content{left:5%;right:5%;max-width:none;top:72%}
            .visual-title{font-size:clamp(2rem,10vw,2.8rem)}
            .visual-desc{font-size:1.08rem}
            .visual-topbar{padding:1rem 1rem}
        }
    </style>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="JUI SSURI">
    <meta property="og:title" content="JUI SSURI, 3D Environment Artist">
    <meta property="og:description" content="Daria Lytvin, 3D environments, materials and lighting portfolio.">
    <meta property="og:image" content="https://juissuri.github.io/assets/images/jui-ssuri-social.png">

    <meta property="og:image:width" content="1733">
    <meta property="og:image:height" content="907">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="JUI SSURI, 3D Environment Artist">
    <meta name="twitter:description" content="Daria Lytvin, 3D environments, materials and lighting portfolio.">
    <meta name="twitter:image" content="https://juissuri.github.io/assets/images/jui-ssuri-social.png">
    <meta name="twitter:image:alt" content="JUI SSURI in white letters on a black background">
    <link rel="stylesheet" href="css/tech-grey-theme.css?v=gibson-color-2">
    <link rel="stylesheet" href="css/atmosphere.css?v=2">
</head>
<body class="project-page">

    <section class="visual-hero" id="visual-hero">
        <div class="visual-bg">
            <img id="visual-img" src="assets/images/PROJECT1.jpeg?v=2" alt="Project visual">
        </div>
        <div class="visual-overlay"></div>
        <nav class="project-page-nav" aria-label="Project navigation">
            <a href="index.html#projects" data-project-back data-i18n="project_back">← BACK</a>
            <a href="project-view.html?id=02" data-project-next data-i18n="project_next">NEXT PROJECT →</a>
            <a href="index.html" data-i18n="project_home">HOME</a>
        </nav>
        <div class="visual-content">
            <h1 class="visual-title" id="visual-title">GIBSON RIDGE</h1>
            <p class="visual-desc" id="visual-desc">Gibson Ridge is a cinematic desert outpost whose atmosphere is shaped by isolation and life far from civilization.</p>
            <div class="visual-actions">
                <a id="visual-detail" href="project-breakdown.html?project=01" data-i18n="details_btn">PROJECT DETAILS</a>
            </div>
        </div>
    </section>

    <script>
        (function(){
            var VISUALS = {
                '01': { title: 'GIBSON RIDGE', desc: 'Gibson Ridge is a cinematic desert outpost whose atmosphere is shaped by isolation and life far from civilization.', img: 'assets/images/gibson-ridge-1920.webp?v=2', pending: false },
                '02': { title: "SIMON'S GARAGE", desc: 'A detailed urban interior study focusing on worn metal surfaces, volumetric lighting, and the quiet tension of an abandoned mechanic\'s workshop.', img: 'assets/images/simons-garage-1200.webp', pending: true },
                '03': { title: 'MOUNTAINS', desc: 'An alpine landscape study exploring atmospheric perspective, layered rock formations, and the interplay of light across rugged terrain.', img: 'assets/images/mountains.jpg', pending: false }
            };
            var params = new URLSearchParams(window.location.search);
            var raw = params.get('id') || params.get('project') || '01';
            var key = Object.prototype.hasOwnProperty.call(VISUALS, raw) ? raw : '01';
            var d = VISUALS[key];
            document.body.dataset.project = key;
            document.getElementById('visual-title').textContent = d.title;
            var descEl = document.getElementById('visual-desc');
            descEl.dataset.i18n = 'details_desc_' + key;
            var img = document.getElementById('visual-img');
            var overlay = document.querySelector('.visual-overlay');
            var bg = document.querySelector('.visual-bg');
            document.getElementById('visual-detail').href = 'project-breakdown.html?project=' + key;
            if(d.pending){
                descEl.innerHTML = '<span style="display:inline-block;border:1px solid rgba(255,255,255,0.24);padding:0.45rem 1rem;border-radius:999px;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,0.06)">AWAITING PUBLICATION</span><span style="display:block;margin-top:1.2rem;font-family:Inter,sans-serif;font-size:1rem;color:#fff">' + d.desc.replace(/</g,'&lt;') + '</span>';
                img.style.display = 'none';
                img.removeAttribute('src');
                if(bg) bg.style.background = '#0A0A0A';
                if(overlay) overlay.style.background = 'rgba(10,10,10,0.92)';
            } else {
                descEl.textContent = d.desc;
                img.style.display = 'block';
                img.src = d.img;
                img.alt = d.title + ', project visual';
                img.onerror = function(){ img.onerror = null; img.src='assets/images/PROJECT1.jpeg?v=2'; };
                if(bg) bg.style.background = '#000';
                if(overlay) overlay.style.background = 'linear-gradient(90deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.12) 45%, transparent 72%)';
            }
            document.title = d.title + ', VISUAL';
        })();
    </script>
    <script src="js/i18n.js?v=gibson-copy-2"></script>
    <script src="js/project-page-nav.js"></script>
    <script src="js/atmosphere.js?v=4"></script>
</body>
