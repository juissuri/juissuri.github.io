<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL — JUI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='32' y='46' font-family='Inter,Arial,sans-serif' font-size='42' font-weight='900' fill='%23FFFFFF' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body{margin:0;background:#000;overflow:hidden}
        .visual-hero{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
        .visual-bg{position:absolute;inset:0}
        .visual-bg img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.7) contrast(1.06) brightness(0.88)}
        .visual-overlay{position:absolute;inset:0;background:linear-gradient(90deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.12) 45%, transparent 72%)}
        .visual-content{position:absolute;left:6%;top:70%;transform:translateY(-50%);max-width:40rem;z-index:2}
        .visual-title{font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;font-size:clamp(2.6rem,5vw,4rem);font-weight:800;letter-spacing:-0.02em;color:#FFFFFF;margin:0 0 1.3rem;line-height:1; text-shadow:0 2px 18px rgba(0,0,0,0.45)}
        .visual-desc{font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;font-size:1.22rem;line-height:1.9;color:rgba(255,255,255,0.92);margin:0;max-width:38rem}
        .visual-nav{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:1.4rem 2rem;pointer-events:none}
        .visual-nav a{pointer-events:auto;font-family:var(--font-mono);font-size:0.75rem;letter-spacing:0.14em;color:rgba(255,255,255,0.85);text-decoration:none;text-transform:uppercase;transition:color 150ms}
        .visual-nav a:hover{color:#FFFFFF}
        .visual-logo{font-family:var(--font-mono);font-size:1.1rem;letter-spacing:0.22em;color:rgba(255,255,255,0.9);text-decoration:none;pointer-events:auto}
        @media(max-width:640px){
            .visual-content{left:5%;right:5%;max-width:none;top:72%}
            .visual-title{font-size:clamp(2rem, 10vw, 2.8rem)}
            .visual-desc{font-size:1.08rem}
            .visual-nav{padding:1rem 1rem}
        }
    </style>
</head>
<body>

    <section class="visual-hero" id="visual-hero">
        <div class="visual-bg">
            <img id="visual-img" src="assets/images/PROJECT1.jpeg" alt="Project visual">
        </div>
        <div class="visual-overlay"></div>
        <div class="visual-content">
            <h1 class="visual-title" id="visual-title">GIBSON RIDGE</h1>
            <p class="visual-desc" id="visual-desc">A sun-scorched desert environment built around large-scale terrain silhouettes, layered dune formations, and a cinematic play of heat, shadow, and distant haze.</p>
        </div>
    </section>

    <!-- Bottom Glass Pill Bar — same as main page -->
    <nav class="navbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <a href="index.html" class="logo logo--text-only" aria-label="JUI">
                    <span class="logo-text">JUI</span>
                </a>
            </div>
            <div class="navbar-right">
                <div class="nav-links">
                    <a href="index.html#projects" class="nav-link">PROJECTS</a>
                    <span class="nav-pipe">|</span>
                    <a href="index.html#experience" class="nav-link">EXPERIENCE</a>
                    <span class="nav-pipe">|</span>
                    <a href="index.html#contact" class="nav-link">CONTACT</a>
                </div>
            </div>
            <button class="nav-burger" id="nav-burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div class="nav-drawer" id="nav-drawer" aria-hidden="true">
            <a href="index.html#projects" class="nav-drawer-link">PROJECTS</a>
            <a href="index.html#experience" class="nav-drawer-link">EXPERIENCE</a>
            <a href="index.html#contact" class="nav-drawer-link">CONTACT</a>
        </div>
    </nav>
    <script>
        const VISUALS = {
            '01': {
                title: 'GIBSON RIDGE',
                desc: 'A sun-scorched desert environment built around large-scale terrain silhouettes, layered dune formations, and a cinematic play of heat, shadow, and distant haze. Procedural Gaea terrain + hand-authored vegetation.',
                img: 'assets/images/PROJECT1.jpeg',
                pending: false
            },
            '02': {
                title: "SIMON'S GARAGE",
                desc: 'Awaiting publication — full breakdown soon.',
                img: 'assets/images/simons-garage.webp',
                pending: true
            },
            '03': {
                title: 'MOUNTAINS',
                desc: 'Awaiting publication — full breakdown soon.',
                img: 'assets/images/hero-waves.jpg',
                pending: true
            }
        };
        (function(){
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('id') || params.get('project') || '01';
            const key = VISUALS[raw] ? raw : '01';
            const d = VISUALS[key];
            document.getElementById('visual-title').textContent = d.title;
            const descEl = document.getElementById('visual-desc');
            const img = document.getElementById('visual-img');
            const overlay = document.querySelector('.visual-overlay');
            const bg = document.querySelector('.visual-bg');
            if(d.pending){
                descEl.innerHTML = '<span style="display:inline-block;border:1px solid rgba(255,255,255,0.24);padding:0.45rem 1rem;border-radius:999px;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.78);background:rgba(255,255,255,0.06);backdrop-filter:blur(6px)">AWAITING PUBLICATION</span><span style="display:block;margin-top:1.2rem;font-family:Inter,sans-serif;font-size:1rem;color:rgba(255,255,255,0.62)">Full breakdown soon.</span>';
                img.style.display = 'none';
                img.removeAttribute('src');
                if(bg) bg.style.background = '#0A0A0A';
                if(overlay) overlay.style.background = 'rgba(10,10,10,0.92)';
            } else {
                descEl.textContent = d.desc;
                img.style.display = 'block';
                img.src = d.img;
                img.onerror = function(){ if(d.img !== 'assets/images/PROJECT1.jpeg'){ img.src='assets/images/PROJECT1.jpeg'; } };
                if(bg) bg.style.background = '#000';
                if(overlay) overlay.style.background = 'linear-gradient(90deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.12) 45%, transparent 72%)';
            }
            document.title = d.title + ' // VISUAL';
        })();
    </script>
    <script>
        // Burger for glass pill on visual page
        (function(){
            const burger = document.getElementById('nav-burger');
            const drawer = document.getElementById('nav-drawer');
            if(!burger || !drawer) return;
            burger.addEventListener('click', function(){
                const open = drawer.classList.toggle('is-open');
                burger.setAttribute('aria-expanded', open ? 'true' : 'false');
                drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
            });
            document.addEventListener('click', function(e){
                if(!drawer.classList.contains('is-open')) return;
                if(drawer.contains(e.target) || burger.contains(e.target)) return;
                drawer.classList.remove('is-open');
                burger.setAttribute('aria-expanded', 'false');
                drawer.setAttribute('aria-hidden', 'true');
            });
        })();
    </script>
</body>
</html>
